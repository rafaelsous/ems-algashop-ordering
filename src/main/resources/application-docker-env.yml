spring:
  datasource:
    url: jdbc:postgresql://algashop-postgres:5432/ordering
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    url: jdbc:postgresql://algashop-postgres:5432/ordering

algashop:
  integrations:
    shipping.provider: RAPIDEX
    rapidex.url: http://wiremock:8080
    product-catalog.url: http://wiremock:8080
  shipping:
    have-free-shipping:
      rule1:
        active: true
        min-points: 100
        min-sales-quantity: 2
      rule2:
        active: true
        min-points: 2000