spring:
  datasource:
    url: ${DATASOURCE_JDBC_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    show-sql: true
  flyway:
    enabled: false
    locations: classpath:db/migration
    user: ${FLYWAY_USERNAME}
    password: ${FLYWAY_PASSWORD}
    url: ${DATASOURCE_JDBC_URL}

algashop:
  integrations:
    shipping.provider: RAPIDEX
    rapidex.url: ${RAPIDEX_URL}
    product-catalog.url: ${PRODUCT_CATALOG_URL}
  shipping:
    have-free-shipping:
      rule1:
        active: true
        min-points: 100
        min-sales-quantity: 2
      rule2:
        active: true
        min-points: 2000