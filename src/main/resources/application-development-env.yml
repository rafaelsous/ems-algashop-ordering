spring:
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://localhost:5432/ordering
    username: postgres
    password: postgres
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/ordering
  data:
    redis:
      host: localhost
      port: 6379
      password: algashop
      database: 1
      timeout: 600
  devtools:
    restart:
      enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://algashop-authorization-server:8081

algashop:
  integrations:
    shipping.provider: RAPIDEX
    rapidex.url: http://localhost:8787
    product-catalog.url: http://localhost:8083
  shipping:
    have-free-shipping:
      rule1:
        active: true
        min-points: 100
        min-sales-quantity: 2
      rule2:
        active: true
        min-points: 2000